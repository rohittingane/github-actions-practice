name: Day 44 - Upload Artifact Demo

on:
    push:
        branches: [main]

jobs:
    generate-and-upload:
        runs-on: ubuntu-latest
        steps:
            - name: Get the code
              uses: actions/checkout@v4

            - name: Generate a report file
              run: |
                  echo "Build Report" > report.txt
                  echo "Date: $(date)" >> report.txt
                  echo "Status: Success" >> report.txt
                  cat report.txt

            - name: Upload report as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-report
                  path: report.txt
