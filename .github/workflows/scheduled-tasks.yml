name: Scheduled Tasks

on:
  schedule:
    - cron: '30 2 * * 1'    # Every Monday at 2:30 AM UTC
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:

jobs:
  scheduled-job:
    runs-on: ubuntu-latest
    steps:
      - name: Show which schedule triggered
        run: echo "Triggered by schedule: ${{ github.event.schedule }}"

      - name: Health check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://api.github.com)
          echo "Health check response code: $response"
          if [ "$response" -ne 200 ]; then
            echo "❌ Health check failed!"
            exit 1
          else
            echo "✅ Health check passed!"
          fi
          