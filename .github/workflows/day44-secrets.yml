name: Day 44 - Secrets Demo

# When to run this workflow
on:
  push:
    branches: [ main ]

jobs:
  check-secret:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the repo code onto the CI machine
      - name: Get the code
        uses: actions/checkout@v4

      # Step 2: Print a safe confirmation message (never print the real secret)
      - name: Print safe message
        run: echo "The secret is set: true"

      # Step 3: Try printing the secret directly, to see what GitHub does
      - name: Try printing secret directly
        run: echo "Direct value: ${{ secrets.MY_SECRET_MESSAGE }}"
        