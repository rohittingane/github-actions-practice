name: Day 44 - Artifacts Between Jobs

on: push

jobs:
    create-file:
        runs-on: ubuntu-latest
        steps:
            - run: echo "Hello from Job 1" > data.txt
            - uses: actions/upload-artifact@v4
              with:
                  name: shared-file
                  path: data.txt

    read-file:
        runs-on: ubuntu-latest
        needs: create-file
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: shared-file
            - run: cat data.txt
