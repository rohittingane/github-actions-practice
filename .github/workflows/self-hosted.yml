name: Self Hosted Runner Demo

on: push

jobs:
  self-hosted-job:
    runs-on: self-hosted
    steps:
      - name: Print hostname
        run: echo "Hostname: $(hostname)"

      - name: Print working directory
        run: echo "Working directory: $(pwd)"

      - name: Create a test file
        run: |
          echo "This file was created by GitHub Actions self-hosted runner" > day42-test-file.txt
          echo "File created successfully!"
          cat day42-test-file.txt
          