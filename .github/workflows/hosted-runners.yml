name: Hosted Runners Demo

on: push

jobs:
  ubuntu-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print details
        run: |
          echo "OS: Ubuntu Latest"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"

      - name: Check pre-installed tools
        run: |
          echo "Docker version:"
          docker --version
          echo "Python version:"
          python3 --version
          echo "Node version:"
          node --version
          echo "Git version:"
          git --version

  windows-job:
    runs-on: windows-latest
    steps:
      - name: Print details
        run: |
          echo "OS: Windows Latest"
          echo "Hostname: $env:COMPUTERNAME"
          echo "User: $env:USERNAME"

  macos-job:
    runs-on: macos-latest
    steps:
      - name: Print details
        run: |
          echo "OS: macOS Latest"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
