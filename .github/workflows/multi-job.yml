name: Multi Jobs Workflow

on: push

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Build setup
              run: echo "Building the app"

    test:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Test app
              run: echo "Running tests"

    deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Deploy app
              run: echo "Deploying"
